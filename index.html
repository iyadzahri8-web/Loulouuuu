
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>رسالة لحبيبي</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  background: linear-gradient(135deg,#ffe0eb,#ffd1dc,#fff0f5);
  font-family: Arial, sans-serif;
  overflow: hidden;
  text-align: center;
  color: #a52a55;
}

.card {
  background: white;
  width: 90%;
  max-width: 430px;
  padding: 30px 20px;
  border-radius: 25px;
  box-shadow: 0 10px 35px #d66b8b55;
  position: relative;
  min-height: 280px;
}

h2 { font-size: 25px; line-height: 1.7; }
p { font-size: 19px; line-height: 1.9; }

.buttons {
  display: flex;
  justify-content: center;
  gap: 15px;
  flex-wrap: wrap;
  margin-top: 30px;
  min-height: 55px;
}

button {
  border: none;
  border-radius: 30px;
  padding: 13px 25px;
  font-size: 18px;
  background: #ed6b91;
  color: white;
  cursor: pointer;
}

.runaway {
  position: fixed;
  z-index: 10;
}

#envelope {
  font-size: 100px;
  cursor: pointer;
}

#letter {
  display: none;
  background: #fff8e9;
  color: #713b48;
  border: 2px solid #f2c6a0;
  border-radius: 15px;
  padding: 22px;
  margin-top: 20px;
  line-height: 2.1;
  font-size: 19px;
  animation: appear 1s ease;
}

@keyframes appear {
  from { opacity: 0; transform: translateY(30px); }
  to { opacity: 1; transform: translateY(0); }
}
</style>
</head>

<body>

<div class="card">
  <h2 id="question">ادخلي اخلي دار دارك</h2>

  <div class="buttons" id="buttons">
    <button class="runaway" id="no">مندخلش</button>
    <button id="yes">صحا</button>
  </div>
</div>

<script>

const question = document.getElementById("question");
const buttons = document.getElementById("buttons");

function makeRun(button) {
  button.classList.add("runaway");

  function escapeButton() {
    const maxX = window.innerWidth - button.offsetWidth - 10;
    const maxY = window.innerHeight - button.offsetHeight - 10;

    button.style.left = Math.max(5, Math.random() * maxX) + "px";
    button.style.top = Math.max(5, Math.random() * maxY) + "px";
  }

  button.addEventListener("mouseenter", escapeButton);

  button.addEventListener("touchstart", function(e) {
    e.preventDefault();
    escapeButton();
  });

  button.addEventListener("click", escapeButton);
}

function nextScreen(text, noText, yesText, yesAction) {
  question.textContent = text;
  buttons.innerHTML = "";

  const no = document.createElement("button");
  no.textContent = noText;

  const yes = document.createElement("button");
  yes.textContent = yesText;

  buttons.append(no, yes);
  makeRun(no);

  yes.addEventListener("click", yesAction);
}

makeRun(document.getElementById("no"));

document.getElementById("yes").addEventListener("click", () => {

  nextScreen(
    "زعفانة مني😔👈🏻👉🏻؟",
    "لالا",
    "هيه",
    () => {

      nextScreen(
        "غدوة نجيب لحبيبي كونديا و منزيدش نعاودها🥰👈🏻👉🏻",
        "منديهش",
        "نديه",
        showEnvelope
      );

    }
  );

});

function showEnvelope() {
  question.textContent = "عندي رسالة ليك";

  buttons.innerHTML = `
    <div id="envelope" onclick="openLetter()">✉</div>
  `;
}

function openLetter() {
  question.textContent = "رسالة لحبيبي";

  buttons.innerHTML = `
    <div id="letter">
      المهم ليوم راهو 11/11 و مكانش كيفاه منبعتش لحبيبي رسالة
      <br><br>
      (علا اساس جامي بعتلك)
      <br><br>
      المهم احبيبي والله انك حلوة احبك.
    </div>
  `;

  document.getElementById("letter").style.display = "block";
}

</script>
</body>
</html>
